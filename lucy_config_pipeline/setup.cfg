[develop]
script_dir=$base/lib/lucy_config_pipeline
[install]
install_scripts=$base/lib/lucy_config_pipeline

[flake8]
max-line-length = 100

[tool:pytest]
testpaths = test
# RoboStack launch_testing* entry points break pytest 8+/9 (see workspace pytest.ini).
addopts = -p no:launch_testing -p no:launch_ros
