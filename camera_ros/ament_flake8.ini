[flake8]
# Same defaults ROS jazzy's ament_flake8 ships (see
# ament_flake8/configuration/ament_flake8.ini), plus a per-file
# exception: this mock fixture's first line can't be wrapped without
# changing the literal string content the test compares against.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
per-file-ignores =
    test/test_camera_publisher.py:E501
