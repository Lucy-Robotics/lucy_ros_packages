[flake8]
# ROS jazzy's ament_flake8 defaults, plus two rules Black's formatting
# conflicts with directly — Black is this repo's formatter of record,
# so flake8 no longer re-litigates the style choices Black already makes:
#   Q000 - Black always normalizes to double quotes.
#   E203 - Black puts a space before ':' in non-trivial slices (PEP 8's
#          own "extended slice" recommendation); pycodestyle disagrees.
# See https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000,E203
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
per-file-ignores =
    test/test_camera_publisher.py:E501
