name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  lint:
    name: Lint (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==24.10.0
      - run: black --check --diff .

  build-and-test:
    uses: Lucy-Robotics/.github/.github/workflows/robot-package-ci.yaml@cma/fix-robot-package-ci-generalize
    with:
      package_name: lucy_ros_packages
      gz_packages: ""
      extra_apt_packages: "python3-pip python3-pytest-mock python3-opencv gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly v4l-utils"
      rosdep_skip_keys: "audio_common micro_ros_agent realsense2_camera thais_urdf"
      repo_subpackages: true
      build_packages: "camera_ros lucy_bringup lucy_ros2_control lucy_config_generator lucy_msgs lucy_config_pipeline lucy_control_supervisor"
      coverage_map: |
        camera_ros:scripts
        lucy_bringup:launch
        lucy_config_generator:lucy_config_generator
        lucy_config_pipeline:src
        lucy_control_supervisor:lucy_control_supervisor
      pytest_disable_plugin_autoload: false

  upload-coverage:
    needs: build-and-test
    uses: Lucy-Robotics/.github/.github/workflows/codecov-upload.yaml@cma/fix-robot-package-ci-generalize
    with:
      artifact_name: coverage-lucy_ros_packages
      flags: lucy_ros_packages
      name: lucy_ros_packages
    secrets: inherit
